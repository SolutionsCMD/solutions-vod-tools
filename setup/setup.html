<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Solutions VOD Tools — Setup</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0a0a0a; color: #e0e0e0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%; overflow: hidden;
      user-select: none;
    }
    body {
      display: flex; flex-direction: column; justify-content: center;
      padding: 28px 32px;
    }
    h1 { margin: 0 0 6px; font-size: 16px; font-weight: 600; color: #5BFC1B; }
    p.subtle { margin: 0 0 22px; font-size: 12px; color: #888; }
    .stage { font-size: 13px; min-height: 18px; margin-bottom: 10px; }
    .bar-track {
      height: 8px; background: #1a1a1a; border-radius: 4px; overflow: hidden;
      border: 1px solid #2a2a2a;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2DA006, #5BFC1B);
      width: 0%;
      transition: width 200ms ease-out;
    }
    .bar-fill.indeterminate {
      width: 30%;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(360%); }
    }
  </style>
</head>
<body>
  <h1>Setting up Solutions VOD Tools</h1>
  <p class="subtle">Downloading yt-dlp and ffmpeg. One-time, ~40 MB.</p>
  <div class="stage" id="stage">Starting...</div>
  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>

  <script>
    const stageEl = document.getElementById('stage');
    const bar     = document.getElementById('bar');

    window.api.onProgress((msg) => {
      stageEl.textContent = msg.message || '';
      if (msg.percent === null || msg.percent === undefined) {
        bar.classList.add('indeterminate');
        bar.style.width = '';
      } else {
        bar.classList.remove('indeterminate');
        bar.style.width = msg.percent + '%';
      }
    });
  </script>
</body>
</html>
